name: Make release keystore (run once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore + key password'
        required: true
        default: 'comickhan'
      alias:
        description: 'Key alias'
        required: true
        default: 'comickhan'

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore comickhan-release.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.store_password }}" \
            -dname "CN=ComicKhan, OU=ComicKhan, O=ComicKhan, L=Tehran, C=IR"

      - name: Base64 encode
        run: base64 -w0 comickhan-release.jks > keystore-base64.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: comickhan-release.jks

      - name: Upload base64 text (for the GitHub secret)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: keystore-base64.txt
